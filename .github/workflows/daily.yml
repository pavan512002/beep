name: Daily refresh

# Every morning: fetch posts, merge duplicates, tag new posts with the LLM, publish the JSON
# the website reads, and commit it. Vercel redeploys the site on every push to main.
on:
  schedule:
    - cron: "30 0 * * *"      # 00:30 UTC = 06:00 IST (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:           # "Run workflow" button for demos and manual refreshes
  push:                        # the Claude Code tagging routine pushed new tags: import + republish
    branches: [main]
    paths: ["state/claude-tags/**"]

permissions:
  contents: write              # to commit the refreshed data

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120       # free-tier pacing: a big tagging backlog takes ~40 min

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle

      - name: Test and build
        working-directory: pipeline
        run: ./gradlew --no-daemon -q test bootJar

      - name: Run pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: java -jar pipeline/build/libs/pipeline.jar

      # Nothing is committed (so nothing is deployed) unless the output is consistent and holds
      # no credentials. The keys are passed in only so the check can look for them.
      - name: Verify output
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: node tools/verify-output.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data state export
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
