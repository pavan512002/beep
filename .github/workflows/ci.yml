name: CI

# Checks code changes before they reach main. Uses only the data already in the repo:
# no API keys, read-only access.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle
      - name: Test
        working-directory: pipeline
        run: ./gradlew --no-daemon test

  web:
    name: Site and output checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: for f in web/*.js eval/*.mjs tagging/*.mjs tools/*.mjs tests/e2e/*.mjs; do node --check "$f"; done
      - name: Published output is consistent
        run: node tools/verify-output.mjs

  browser:
    name: Browser smoke tests
    # Pinned: Playwright 1.55 can't install its browser on ubuntu-latest (26.04).
    # Move to ubuntu-latest together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
